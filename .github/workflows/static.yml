# Deploys shortcuts/img2video/ as the root of the GitHub Pages site.

name: Deploy Img2Video to GitHub Pages

on:
  push:
    branches: ["claude/img2video-safari-multiprompt-7imqv7"]
    paths:
      - "shortcuts/img2video/**"
      - ".github/workflows/static.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./shortcuts/img2video"

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
